<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NutriLog</title>
<script>
  (function() {
    var saved = localStorage.getItem('nutrilog-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();

<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface2: #f1f5f9;
    --border: #e2e8f0;
    --accent: #10b981;
    --accent2: #6366f1;
    --warn: #d97706;
    --danger: #dc2626;
    --text: #0f172a;
    --text-muted: #94a3b8;
    --text-dim: #475569;
    --radius: 14px;
    --radius-sm: 8px;
  }
  :root[data-theme="dark"] {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3248;
    --accent: #6ee7b7;
    --accent2: #818cf8;
    --warn: #f59e0b;
    --danger: #ef4444;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --text-dim: #94a3b8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3248;
      --accent: #6ee7b7;
      --accent2: #818cf8;
      --warn: #f59e0b;
      --danger: #ef4444;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
    }
  }
  .theme-toggle { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; width: 34px; height: 34px; font-size: 0.95rem; cursor: pointer; flex-shrink: 0; }
  .theme-toggle:active { background: var(--border); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  /* HEADER */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .logo { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .date-nav { display: flex; align-items: center; gap: 8px; }
  .date-nav button { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 0.9rem; }
  .date-nav button:active { background: var(--border); }
  .date-label { font-size: 0.85rem; color: var(--text-dim); min-width: 90px; text-align: center; }

  /* CALORIE RING SUMMARY */
  .summary-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px; }
  .macro-row { display: flex; gap: 12px; align-items: center; }
  .cal-display { flex: 0 0 auto; text-align: center; }
  .cal-number { font-size: 2rem; font-weight: 800; color: var(--accent); line-height: 1; }
  .cal-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
  .macro-pills { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
  .macro-pill { background: var(--surface2); border-radius: 8px; padding: 8px 12px; text-align: center; flex: 1; min-width: 60px; }
  .macro-pill .val { font-size: 1rem; font-weight: 700; }
  .macro-pill .lbl { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .macro-pill.protein .val { color: #60a5fa; }
  .macro-pill.carbs .val { color: #f59e0b; }
  .macro-pill.fat .val { color: #c084fc; }

  /* MEAL SLOTS */
  .slots-container { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .slot-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .slot-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; cursor: pointer; user-select: none; }
  .slot-header:active { background: var(--surface2); }
  .slot-title { display: flex; align-items: center; gap: 10px; }
  .slot-icon { font-size: 1.3rem; }
  .slot-name { font-weight: 600; font-size: 0.95rem; }
  .slot-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 1px; }
  .slot-right { display: flex; align-items: center; gap: 8px; }
  .slot-cals { font-size: 0.8rem; color: var(--accent); font-weight: 600; }
  .chevron { color: var(--text-muted); font-size: 0.8rem; transition: transform 0.2s; }
  .slot-card.open .chevron { transform: rotate(180deg); }

  .slot-body { display: none; padding: 0 14px 14px; }
  .slot-card.open .slot-body { display: block; }

  /* Logged items */
  .logged-items { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .log-entry { background: var(--surface2); border-radius: var(--radius-sm); padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; }
  .log-entry-left { flex: 1; }
  .log-entry-name { font-size: 0.9rem; font-weight: 600; }
  .log-entry-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
  .log-entry-cals { font-size: 0.9rem; font-weight: 700; color: var(--accent); margin-right: 10px; }
  .btn-remove { background: none; border: none; color: var(--text-muted); font-size: 1.1rem; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
  .btn-remove:active { color: var(--danger); }

  .add-food-btn { width: 100%; background: var(--surface2); border: 1px dashed var(--border); color: var(--text-dim); border-radius: var(--radius-sm); padding: 10px; font-size: 0.85rem; cursor: pointer; text-align: center; }
  .add-food-btn:active { background: var(--border); }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: flex-end; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; max-height: 85vh; overflow: hidden; display: flex; flex-direction: column; }
  .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; }
  .modal-header { padding: 14px 16px 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .modal-title { font-weight: 700; font-size: 1rem; }
  .modal-close { background: none; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; }
  .search-box { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .search-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 14px; font-size: 0.95rem; outline: none; }
  .search-input:focus { border-color: var(--accent); }
  .food-list { overflow-y: auto; flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .food-option { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
  .food-option:active { border-color: var(--accent); background: var(--surface); }
  .food-option-left .food-name { font-size: 0.9rem; font-weight: 600; }
  .food-option-left .food-serving { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
  .food-option-right { font-size: 0.9rem; font-weight: 700; color: var(--accent); }
  .food-option.suggested { border-color: var(--accent); }

  .scan-btn { flex-shrink: 0; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; width: 44px; font-size: 1.2rem; cursor: pointer; }
  .scan-btn:active { background: var(--border); }
  .scan-status { margin-top: 10px; font-size: 0.8rem; color: var(--text-dim); background: var(--surface2); border-radius: var(--radius-sm); padding: 10px 12px; }
  .scan-status .caption { font-style: italic; }

  /* Barcode scanner overlay */
  .barcode-overlay { position: fixed; inset: 0; background: #000; z-index: 400; display: none; flex-direction: column; }
  .barcode-overlay.open { display: flex; }
  .barcode-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; color: #fff; background: rgba(0,0,0,0.6); font-size: 0.9rem; font-weight: 600; }
  .barcode-header .modal-close { color: #fff; }
  #barcodeVideo { flex: 1; width: 100%; object-fit: cover; background: #000; }
  .barcode-viewfinder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 320px; height: 120px; border: 3px solid var(--accent); border-radius: 12px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.4); pointer-events: none; }
  .barcode-status { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; color: #fff; font-size: 0.85rem; padding: 0 20px; }

  /* QTY modal */
  .qty-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 300; display: none; align-items: center; justify-content: center; padding: 20px; }
  .qty-modal.open { display: flex; }
  .qty-card { background: var(--surface); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 340px; }
  .qty-title { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
  .qty-subtitle { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 20px; }
  .qty-controls { display: flex; align-items: center; gap: 16px; justify-content: center; margin-bottom: 20px; }
  .qty-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); width: 44px; height: 44px; border-radius: 50%; font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .qty-val { font-size: 1.8rem; font-weight: 800; min-width: 60px; text-align: center; }
  .qty-cal-preview { text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }
  .qty-cal-preview span { color: var(--accent); font-weight: 700; }
  .btn-confirm { width: 100%; background: var(--accent); color: #0f1117; border: none; border-radius: 10px; padding: 13px; font-size: 1rem; font-weight: 700; cursor: pointer; }
  .btn-confirm:active { opacity: 0.85; }
  .btn-cancel { width: 100%; background: none; border: none; color: var(--text-muted); font-size: 0.9rem; cursor: pointer; margin-top: 10px; padding: 8px; }

  /* Voice log */
  .voice-fab { position: fixed; bottom: 92px; right: 16px; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #0f1117; border: none; font-size: 1.5rem; box-shadow: 0 4px 14px rgba(0,0,0,0.3); cursor: pointer; z-index: 150; display: flex; align-items: center; justify-content: center; }
  .voice-fab:active { opacity: 0.85; }
  .voice-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 320; display: none; align-items: center; justify-content: center; padding: 20px; }
  .voice-overlay.open { display: flex; }
  .voice-card { background: var(--surface); border-radius: var(--radius); padding: 28px 22px; width: 100%; max-width: 360px; text-align: center; position: relative; }
  .voice-card .modal-close { position: absolute; top: 10px; right: 12px; }
  .voice-mic-icon { font-size: 2.6rem; margin: 6px 0 14px; }
  .voice-mic-icon.listening { animation: voicePulse 1.2s ease-in-out infinite; }
  @keyframes voicePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .voice-status { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; }
  .voice-transcript { font-size: 1.05rem; font-weight: 600; min-height: 1.4em; margin-bottom: 16px; }
  .voice-fallback { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 14px; font-size: 0.95rem; outline: none; margin-bottom: 12px; }
  .voice-fallback:focus { border-color: var(--accent); }

  /* Nav bar */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); display: flex; z-index: 100; }
  .nav-item { flex: 1; padding: 10px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; text-decoration: none; color: var(--text-muted); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .nav-item.active { color: var(--accent); }
  .nav-icon { font-size: 1.2rem; }
  .main-content { padding-bottom: 80px; }
  .brand-footer { display: flex; justify-content: center; padding: 20px 16px 8px; }
  .brand-footer img { height: 26px; width: auto; border-radius: 5px; opacity: 0.9; }

  /* Empty state */
  .empty-hint { text-align: center; padding: 16px; color: var(--text-muted); font-size: 0.8rem; }
</style>

<div id="acctSwitcher"></div>
<script>
function escapeHtmlSwitcher(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
(async function initAcctSwitcher() {
  const [me, accessible] = await Promise.all([
    fetch('/api/me').then(r => r.json()),
    fetch('/api/delegates/accessible').then(r => r.json())
  ]);
  if (!me.acting_as && accessible.length === 0) return;

  const el = document.getElementById('acctSwitcher');
  el.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 16px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:0.8rem;color:var(--text-muted);';
  const meLabel = escapeHtmlSwitcher(me.real_display_name || me.real_email);
  const options = [`<option value="">${meLabel} (you)</option>`].concat(
    accessible.map(a => `<option value="${a.id}" ${me.acting_as && me.id === a.id ? 'selected' : ''}>${escapeHtmlSwitcher(a.display_name || a.email)}</option>`)
  );
  el.innerHTML = `Viewing: <select id="acctSelect" style="font-size:0.8rem;padding:2px 6px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);">${options.join('')}</select>`;
  document.getElementById('acctSelect').addEventListener('change', async (e) => {
    await fetch('/api/act-as', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({owner_user_id: e.target.value || null}) });
    window.location.reload();
  });
})();
</script>

<script>
const API = '';
let currentDate = new Date();
let categories = [];
let logEntries = [];
let currentSlot = null;
let currentFoodItem = null;
let currentQty = 1;
let allFoods = [];
let openSlots = new Set();
let voicePendingQty = null;

function isoDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function formatDate(d) {
  const today = new Date(); today.setHours(0,0,0,0);
  const yesterday = new Date(today); yesterday.setDate(today.getDate()-1);
  d.setHours(0,0,0,0);
  if (d.getTime() === today.getTime()) return 'Today';
  if (d.getTime() === yesterday.getTime()) return 'Yesterday';
  return d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
}

document.getElementById('prevDay').onclick = () => { currentDate.setDate(currentDate.getDate()-1); refresh(); };
document.getElementById('nextDay').onclick = () => { currentDate.setDate(currentDate.getDate()+1); refresh(); };

// ── Theme toggle ──────────────────────────────────────────────────────────
function currentTheme() {
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr) return attr;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyThemeIcon() {
  document.getElementById('themeToggle').textContent = currentTheme() === 'dark' ? '☀️' : '🌙';
}
document.getElementById('themeToggle').onclick = () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('nutrilog-theme', next);
  applyThemeIcon();
};

async function loadData() {
  const [catsRes, foodsRes, logRes, summaryRes] = await Promise.all([
    fetch('/api/categories'),
    fetch('/api/food-items'),
    fetch(`/api/log?date=${isoDate(currentDate)}`),
    fetch(`/api/log/summary?date=${isoDate(currentDate)}`)
  ]);
  categories = await catsRes.json();
  allFoods = await foodsRes.json();

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderSlots() {

  container.innerHTML = '';

  categories.forEach(cat => {
    const slotEntries = logEntries.filter(e => e.meal_slot === cat.id);
    const slotCals = slotEntries.reduce((s, e) => s + (e.calories_actual || 0), 0);
    const isOpen = openSlots.has(cat.id) || slotEntries.length > 0;
    if (isOpen) openSlots.add(cat.id);

    card.className = 'slot-card' + (isOpen ? ' open' : '');
    card.innerHTML = `
      <div class="slot-header">
        <div class="slot-title">
          <span class="slot-icon">${escapeHtml(cat.icon)}</span>
          <div>
            <div class="slot-name">${escapeHtml(cat.name)}</div>
            <div class="slot-meta">${slotEntries.length} item${slotEntries.length !== 1 ? 's' : ''}</div>
          </div>
        </div>
        <div class="slot-right">
          ${slotCals > 0 ? `<span class="slot-cals">${slotCals} kcal</span>` : ''}
          <span class="chevron">▾</span>
        </div>
      </div>
      <div class="slot-body">
        <div class="logged-items" id="items-${cat.id}">
          ${slotEntries.length === 0 ? '<div class="empty-hint">Nothing logged yet</div>' :
            slotEntries.map(e => `
              <div class="log-entry" data-id="${e.id}">
                <div class="log-entry-left">
                  <div class="log-entry-name">${escapeHtml(e.food_name)}</div>
                  <div class="log-entry-meta">${e.quantity > 1 ? e.quantity + '× ' : ''}${escapeHtml(e.serving_size)}${escapeHtml(e.serving_unit)}</div>

                <button class="btn-remove" data-lid="${e.id}">✕</button>

      </div>
    `;

    card.querySelector('.slot-header').addEventListener('click', () => {
      if (isOpen) openSlots.delete(cat.id); else openSlots.add(cat.id);

        <div class="empty-hint">No items found for "${escapeHtml(query)}"</div>

let barcodeReader = null;
let barcodeStream = null;
let barcodeLookupInFlight = false;

if (typeof ZXing === 'undefined') {
  document.getElementById('barcodeBtn').style.display = 'none';
} else {
  document.getElementById('barcodeBtn').onclick = () => openBarcodeScanner();
}

async function openBarcodeScanner() {
  if (!currentSlot) return;
  barcodeLookupInFlight = false;
  document.getElementById('barcodeOverlay').classList.add('open');
  document.getElementById('barcodeStatus').textContent = '';
  const video = document.getElementById('barcodeVideo');

  try {
    barcodeStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = barcodeStream;

    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E,
    ]);
    barcodeReader = new ZXing.BrowserMultiFormatReader(hints);
    // Callback fires repeatedly per decoded frame — barcodeLookupInFlight
    // guards against triggering a lookup per-frame while one is in progress.
    barcodeReader.decodeFromVideoDevice(null, video, (result) => {
      if (result && !barcodeLookupInFlight) onBarcodeDetected(result.getText());
    });
  } catch (err) {
    document.getElementById('barcodeStatus').textContent = "Couldn't access the camera — check permissions.";
  }
}

function closeBarcodeScanner() {
  document.getElementById('barcodeOverlay').classList.remove('open');
  if (barcodeReader) { barcodeReader.reset(); barcodeReader = null; }
  if (barcodeStream) { barcodeStream.getTracks().forEach(t => t.stop()); barcodeStream = null; }
}

async function onBarcodeDetected(code) {
  barcodeLookupInFlight = true;
  const statusEl = document.getElementById('barcodeStatus');
  statusEl.textContent = `Looking up ${code}…`;

  try {
    const res = await fetch('/api/barcode-lookup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, category_id: currentSlot })
    });
    const result = await res.json();
    if (result.found) {
      closeBarcodeScanner();
      openQtyModal(result.item);
      return;
    }
    statusEl.textContent = `No product found for ${code} — try searching instead, or scan another item.`;
  } catch (err) {
    statusEl.textContent = 'Lookup failed — try again.';
  }
  barcodeLookupInFlight = false;
}

// ── Voice logging ────────────────────────────────────────────────────────
// Fully client-side: speech-to-text via the browser's Web Speech API (falls
// back to a plain text input — e.g. Safari/iOS, where the user's own
// keyboard dictation button produces the same result), then matched against
// the foods/categories already loaded for this page. Reuses the existing
// food-search + quantity-modal flow rather than building a parallel one —
// a confident single match jumps straight to the quantity modal (pre-filled
// with any amount mentioned, but always shown so the user can confirm/adjust
// — nothing is logged without that step); anything ambiguous falls back to
// the normal search list, pre-filled with the parsed query, for the user to
// pick from — same "ask for amount" guarantee either way.

const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
let voiceRecognition = null;

const VOICE_NUMBER_WORDS = {
  half: 0.5, a: 1, an: 1, one: 1, single: 1, couple: 2, two: 2, few: 3, three: 3,
  four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, twelve: 12,
};

function parseVoiceQuantity(text) {
  let m = text.match(/\bhalf\s+(?:a|an)\b/i);
  if (m) return { qty: 0.5, remaining: text.replace(m[0], '').trim() };

  m = text.match(/\bcouple\s+of\b/i);
  if (m) return { qty: 2, remaining: text.replace(m[0], '').trim() };

  m = text.match(/\b(\d+(?:\.\d+)?)\b/);
  if (m) return { qty: parseFloat(m[1]), remaining: text.replace(m[0], '').trim() };

  for (const [word, val] of Object.entries(VOICE_NUMBER_WORDS)) {
    const re = new RegExp(`\\b${word}\\b`, 'i');
    if (re.test(text)) return { qty: val, remaining: text.replace(re, '').trim() };
  }
  return { qty: null, remaining: text };
}

const VOICE_MEAL_KEYWORDS = {
  breakfast: ['breakfast', 'brekky'],
  morning: ['morning tea', 'morning snack'],
  lunch: ['lunch', 'midday'],
  afternoon: ['afternoon tea', 'afternoon snack'],
  dinner: ['dinner', 'tea', 'supper'],
  snack: ['snack'],
  drink: ['drink', 'beverage'],
};

function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function detectVoiceSlot(text) {
  const lower = text.toLowerCase();

  // Flatten to one candidate list: the user's own category names first
  // (exact vocabulary), then common synonyms mapped to whichever of their
  // categories contains that canonical word (handles renamed/custom
  // catalogs too).
  const candidates = categories.map(cat => ({ name: cat.name.toLowerCase(), catId: cat.id }));
  for (const [canonical, synonyms] of Object.entries(VOICE_MEAL_KEYWORDS)) {
    const cat = categories.find(c => c.name.toLowerCase().includes(canonical));
    if (!cat) continue;
    for (const syn of synonyms) candidates.push({ name: syn, catId: cat.id });
  }

  // 1. Highest confidence: a meal word explicitly introduced by "for"/"at"
  // ("...for lunch", "...at breakfast") — this is how people actually say
  // which meal something belongs to, and must win even when an earlier
  // word in the sentence happens to contain a meal name too (e.g. "a
  // breakfast burrito for lunch" — the food is a "breakfast burrito", but
  // the meal is lunch).
  for (const { name, catId } of candidates) {
    const re = new RegExp(`\\b(?:for|at)\\s+${escapeRegex(name)}\\b`);
    if (re.test(lower)) return { catId, matchedText: name, viaConnector: true };
  }

  // 2. Otherwise, any mention anywhere in the sentence.
  for (const { name, catId } of candidates) {
    const re = new RegExp(`\\b${escapeRegex(name)}\\b`);
    if (re.test(lower)) return { catId, matchedText: name, viaConnector: false };
  }

  // 3. Nothing said about it — guess from time of day.
  const hour = new Date().getHours();
  const guess = hour < 10 ? 'breakfast' : hour < 12 ? 'morning' : hour < 14 ? 'lunch'
    : hour < 17 ? 'afternoon' : hour < 21 ? 'dinner' : 'snack';
  const guessed = categories.find(c => c.name.toLowerCase().includes(guess));
  if (guessed) return { catId: guessed.id, matchedText: null };

  // 4. Fully custom catalog with no recognizable name — spread categories
  // proportionally across the day rather than always defaulting to the first.
  if (categories.length) {
    const idx = Math.min(categories.length - 1, Math.floor((hour / 24) * categories.length));
    return { catId: categories[idx].id, matchedText: null };
  }
  return { catId: null, matchedText: null };
}

function parseVoiceTranscript(rawText) {
  let text = rawText.trim();
  const slotResult = detectVoiceSlot(text);
  if (slotResult.matchedText) {
    const pattern = slotResult.viaConnector
      ? `\\b(?:for|at)\\s+${escapeRegex(slotResult.matchedText)}\\b`
      : `\\b${escapeRegex(slotResult.matchedText)}\\b`;
    text = text.replace(new RegExp(pattern, 'i'), '').trim();
  }
  text = text.replace(/\b(?:for|at)\s*$/i, '').trim();

  const qtyResult = parseVoiceQuantity(text);
  text = qtyResult.remaining.replace(/^\s*of\b/i, '').trim();

  return { cleanQuery: text, quantity: qtyResult.qty || 1, catId: slotResult.catId };
}

function scoreFoodMatch(query, item) {
  const queryLower = query.toLowerCase().trim();
  const nameLower = item.name.toLowerCase();
  if (!queryLower) return 0;
  if (nameLower === queryLower) return 1;

  const qWords = queryLower.split(/\s+/).filter(Boolean);
  const nameWords = new Set(nameLower.split(/\s+/).filter(Boolean));
  const overlap = qWords.filter(w => nameWords.has(w)).length;
  let score = overlap / qWords.length;
  if (nameLower.includes(queryLower) || queryLower.includes(nameLower)) score = Math.max(score, 0.8);
  return score;
}

function matchFoodsForVoice(query) {
  return allFoods
    .map(item => ({ item, score: scoreFoodMatch(query, item) }))
    .filter(r => r.score > 0.35)
    .sort((a, b) => b.score - a.score);
}

function setVoiceListening(isListening) {
  document.getElementById('voiceMicIcon').classList.toggle('listening', isListening);
}

function openVoiceOverlay() {
  if (categories.length === 0) { alert('Still loading — try again in a moment.'); return; }

  document.getElementById('voiceOverlay').classList.add('open');
  document.getElementById('voiceTranscript').textContent = '';
  const fallback = document.getElementById('voiceTextFallback');
  const submitBtn = document.getElementById('voiceSubmitText');

  if (SpeechRecognitionCtor) {
    fallback.style.display = 'none';
    submitBtn.style.display = 'none';
    document.getElementById('voiceStatus').textContent = 'Listening…';
    startVoiceRecognition();
  } else {
    setVoiceListening(false);
    document.getElementById('voiceStatus').textContent = 'Type what you ate, or use your keyboard’s dictation button';
    fallback.style.display = 'block';
    submitBtn.style.display = 'block';
    fallback.value = '';
    setTimeout(() => fallback.focus(), 100);
  }
}

function startVoiceRecognition() {
  setVoiceListening(true);
  voiceRecognition = new SpeechRecognitionCtor();
  voiceRecognition.lang = 'en-AU';
  voiceRecognition.interimResults = true;
  voiceRecognition.maxAlternatives = 1;

  voiceRecognition.onresult = (event) => {
    let interim = '', final = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) final += transcript;
      else interim += transcript;
    }
    document.getElementById('voiceTranscript').textContent = final || interim;
    if (final) {
      voiceRecognition.stop();
      finishVoiceCapture(final);
    }
  };
  voiceRecognition.onerror = () => {
    setVoiceListening(false);
    document.getElementById('voiceStatus').textContent = "Didn't catch that — try again, or type below.";
    document.getElementById('voiceTextFallback').style.display = 'block';
    document.getElementById('voiceSubmitText').style.display = 'block';
  };
  voiceRecognition.onend = () => setVoiceListening(false);
  voiceRecognition.start();
}

function closeVoiceOverlay() {
  if (voiceRecognition) { try { voiceRecognition.stop(); } catch (e) {} voiceRecognition = null; }
  setVoiceListening(false);
  document.getElementById('voiceOverlay').classList.remove('open');
}

function finishVoiceCapture(transcript) {
  closeVoiceOverlay();
  const { cleanQuery, quantity, catId } = parseVoiceTranscript(transcript);
  if (!catId) { alert("Couldn't figure out which meal to log this under — try the + Add button instead."); return; }

  currentSlot = catId;
  const cat = categories.find(c => c.id === catId);

  // Prep the food-picker modal in the background (even for a confident
  // match) so Cancel from the quantity modal lands somewhere sensible
  // instead of a stale/blank list.
  document.getElementById('modalTitle').textContent = `Add to ${cat ? cat.name : 'meal'}`;
  document.getElementById('searchInput').value = cleanQuery;
  renderFoodList(cleanQuery);

  // Set once here rather than only on a confident match, so whichever path
  // eventually reaches openQtyModal — an auto-match, a manual pick from the
  // fallback search list, or a freshly quick-added item — still honors the
  // amount actually said.
  voicePendingQty = quantity;

  const matches = matchFoodsForVoice(cleanQuery);
  const confident = matches.length > 0 && matches[0].score >= 0.6 &&
    (matches.length === 1 || matches[0].score - matches[1].score >= 0.25);

  if (confident) {
    openQtyModal(matches[0].item);
  } else {
    document.getElementById('foodModal').classList.add('open');
  }
}

document.getElementById('voiceFab').onclick = openVoiceOverlay;
document.getElementById('closeVoiceOverlay').onclick = closeVoiceOverlay;
document.getElementById('voiceSubmitText').onclick = () => {
  const val = document.getElementById('voiceTextFallback').value.trim();
  if (val) finishVoiceCapture(val);
};
document.getElementById('voiceTextFallback').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('voiceSubmitText').click();
});

async function refresh() {
  document.getElementById('dateLabel').textContent = formatDate(new Date(currentDate));
  const summary = await loadData();
  updateSummary(summary);
  renderSlots();
}

refresh();
</script>
</body>
</html>
