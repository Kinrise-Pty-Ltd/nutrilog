<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NutriLog</title>
<script>
  (function() {
    var saved = localStorage.getItem('nutrilog-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface2: #f1f5f9;
    --border: #e2e8f0;
    --accent: #10b981;
    --accent2: #6366f1;
    --warn: #d97706;
    --danger: #dc2626;
    --text: #0f172a;
    --text-muted: #94a3b8;
    --text-dim: #475569;
    --radius: 14px;
    --radius-sm: 8px;
  }
  :root[data-theme="dark"] {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3248;
    --accent: #6ee7b7;
    --accent2: #818cf8;
    --warn: #f59e0b;
    --danger: #ef4444;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --text-dim: #94a3b8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3248;
      --accent: #6ee7b7;
      --accent2: #818cf8;
      --warn: #f59e0b;
      --danger: #ef4444;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
    }
  }
  .theme-toggle { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; width: 34px; height: 34px; font-size: 0.95rem; cursor: pointer; flex-shrink: 0; }
  .theme-toggle:active { background: var(--border); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  /* HEADER */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .logo { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .date-nav { display: flex; align-items: center; gap: 8px; }
  .date-nav button { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 0.9rem; }
  .date-nav button:active { background: var(--border); }
  .date-label { font-size: 0.85rem; color: var(--text-dim); min-width: 90px; text-align: center; }

  /* CALORIE RING SUMMARY */
  .summary-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px; }
  .macro-row { display: flex; gap: 12px; align-items: center; }
  .cal-display { flex: 0 0 auto; text-align: center; }
  .cal-number { font-size: 2rem; font-weight: 800; color: var(--accent); line-height: 1; }
  .cal-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
  .macro-pills { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
  .macro-pill { background: var(--surface2); border-radius: 8px; padding: 8px 12px; text-align: center; flex: 1; min-width: 60px; }
  .macro-pill .val { font-size: 1rem; font-weight: 700; }
  .macro-pill .lbl { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .macro-pill.protein .val { color: #60a5fa; }
  .macro-pill.carbs .val { color: #f59e0b; }
  .macro-pill.fat .val { color: #c084fc; }

  /* MEAL SLOTS */
  .slots-container { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .slot-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .slot-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; cursor: pointer; user-select: none; }
  .slot-header:active { background: var(--surface2); }
  .slot-title { display: flex; align-items: center; gap: 10px; }
  .slot-icon { font-size: 1.3rem; }
  .slot-name { font-weight: 600; font-size: 0.95rem; }
  .slot-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 1px; }
  .slot-right { display: flex; align-items: center; gap: 8px; }
  .slot-cals { font-size: 0.8rem; color: var(--accent); font-weight: 600; }
  .chevron { color: var(--text-muted); font-size: 0.8rem; transition: transform 0.2s; }
  .slot-card.open .chevron { transform: rotate(180deg); }

  .slot-body { display: none; padding: 0 14px 14px; }
  .slot-card.open .slot-body { display: block; }

  /* Logged items */
  .logged-items { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .log-entry { background: var(--surface2); border-radius: var(--radius-sm); padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; }
  .log-entry-left { flex: 1; }
  .log-entry-name { font-size: 0.9rem; font-weight: 600; }
  .log-entry-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
  .log-entry-cals { font-size: 0.9rem; font-weight: 700; color: var(--accent); margin-right: 10px; }
  .btn-remove { background: none; border: none; color: var(--text-muted); font-size: 1.1rem; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
  .btn-remove:active { color: var(--danger); }

  .add-food-btn { width: 100%; background: var(--surface2); border: 1px dashed var(--border); color: var(--text-dim); border-radius: var(--radius-sm); padding: 10px; font-size: 0.85rem; cursor: pointer; text-align: center; }
  .add-food-btn:active { background: var(--border); }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: flex-end; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; max-height: 85vh; overflow: hidden; display: flex; flex-direction: column; }
  .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; }
  .modal-header { padding: 14px 16px 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .modal-title { font-weight: 700; font-size: 1rem; }
  .modal-close { background: none; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; }
  .search-box { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .search-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 14px; font-size: 0.95rem; outline: none; }
  .search-input:focus { border-color: var(--accent); }
  .food-list { overflow-y: auto; flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .food-option { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
  .food-option:active { border-color: var(--accent); background: var(--surface); }
  .food-option-left .food-name { font-size: 0.9rem; font-weight: 600; }
  .food-option-left .food-serving { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
  .food-option-right { font-size: 0.9rem; font-weight: 700; color: var(--accent); }
  .food-option.suggested { border-color: var(--accent); }

  .scan-btn { flex-shrink: 0; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; width: 44px; font-size: 1.2rem; cursor: pointer; }
  .scan-btn:active { background: var(--border); }
  .scan-status { margin-top: 10px; font-size: 0.8rem; color: var(--text-dim); background: var(--surface2); border-radius: var(--radius-sm); padding: 10px 12px; }
  .scan-status .caption { font-style: italic; }

  /* QTY modal */
  .qty-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 300; display: none; align-items: center; justify-content: center; padding: 20px; }
  .qty-modal.open { display: flex; }
  .qty-card { background: var(--surface); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 340px; }
  .qty-title { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
  .qty-subtitle { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 20px; }
  .qty-controls { display: flex; align-items: center; gap: 16px; justify-content: center; margin-bottom: 20px; }
  .qty-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); width: 44px; height: 44px; border-radius: 50%; font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .qty-val { font-size: 1.8rem; font-weight: 800; min-width: 60px; text-align: center; }
  .qty-cal-preview { text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }
  .qty-cal-preview span { color: var(--accent); font-weight: 700; }
  .btn-confirm { width: 100%; background: var(--accent); color: #0f1117; border: none; border-radius: 10px; padding: 13px; font-size: 1rem; font-weight: 700; cursor: pointer; }
  .btn-confirm:active { opacity: 0.85; }
  .btn-cancel { width: 100%; background: none; border: none; color: var(--text-muted); font-size: 0.9rem; cursor: pointer; margin-top: 10px; padding: 8px; }

  /* Nav bar */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); display: flex; z-index: 100; }
  .nav-item { flex: 1; padding: 10px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; text-decoration: none; color: var(--text-muted); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .nav-item.active { color: var(--accent); }
  .nav-icon { font-size: 1.2rem; }
  .main-content { padding-bottom: 80px; }
  .brand-footer { display: flex; justify-content: center; padding: 20px 16px 8px; }
  .brand-footer img { height: 26px; width: auto; border-radius: 5px; opacity: 0.9; }

  /* Empty state */
  .empty-hint { text-align: center; padding: 16px; color: var(--text-muted); font-size: 0.8rem; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">Nutri<span>Log</span></div>
  </div>
  <div class="date-nav">
    <button id="prevDay">‹</button>
    <div class="date-label" id="dateLabel">Today</div>
    <button id="nextDay">›</button>
    <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
  </div>
</div>

<div class="summary-bar">
  <div class="macro-row">
    <div class="cal-display">
      <div class="cal-number" id="totalCals">0</div>
      <div class="cal-label">kcal</div>
    </div>
    <div class="macro-pills">
      <div class="macro-pill protein"><div class="val" id="totalProtein">0g</div><div class="lbl">Protein</div></div>
      <div class="macro-pill carbs"><div class="val" id="totalCarbs">0g</div><div class="lbl">Carbs</div></div>
      <div class="macro-pill fat"><div class="val" id="totalFat">0g</div><div class="lbl">Fat</div></div>
    </div>
  </div>
</div>

<div class="main-content">
  <div class="slots-container" id="slotsContainer"></div>
  <div class="brand-footer"><img src="/public/assets/KingroupLogo.jpg" alt="Kin Group"></div>
</div>

<nav class="bottom-nav">
  <a class="nav-item active" href="/">
    <span class="nav-icon">📋</span>Log
  </a>
  <a class="nav-item" href="/calendar">
    <span class="nav-icon">📅</span>Calendar
  </a>
  <a class="nav-item" href="/oura">
    <span class="nav-icon">💍</span>Oura
  </a>
  <a class="nav-item" href="/health">
    <span class="nav-icon">🍎</span>Health
  </a>
  <a class="nav-item" href="/admin">
    <span class="nav-icon">⚙️</span>Admin
  </a>
</nav>

<!-- Food picker modal -->
<div class="modal-overlay" id="foodModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Add Food</div>
      <button class="modal-close" id="closeModal">×</button>
    </div>
    <div class="search-box">
      <div style="display:flex;gap:8px;">
        <input class="search-input" id="searchInput" type="text" placeholder="Search foods…" autocomplete="off" style="flex:1;">
        <button class="scan-btn" id="scanBtn" type="button" title="Scan a photo">📷</button>
      </div>
      <input type="file" id="scanFileInput" accept="image/*" capture="environment" style="display:none;">
      <div id="scanStatus" class="scan-status" style="display:none;"></div>
    </div>
    <div class="food-list" id="foodList"></div>
  </div>
</div>

<!-- Quantity modal -->
<div class="qty-modal" id="qtyModal">
  <div class="qty-card">
    <div class="qty-title" id="qtyItemName"></div>
    <div class="qty-subtitle" id="qtyItemServing"></div>
    <div class="qty-controls">
      <button class="qty-btn" id="qtyMinus">−</button>
      <div class="qty-val" id="qtyVal">1</div>
      <button class="qty-btn" id="qtyPlus">+</button>
    </div>
    <div class="qty-cal-preview">Calories: <span id="qtyCals">0</span> kcal</div>
    <button class="btn-confirm" id="qtyConfirm">Add to Log</button>
    <button class="btn-cancel" id="qtyCancel">Cancel</button>
  </div>
</div>

<script>
const API = '';
let currentDate = new Date();
let categories = [];
let logEntries = [];
let currentSlot = null;
let currentFoodItem = null;
let currentQty = 1;
let allFoods = [];
let openSlots = new Set();

function isoDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function formatDate(d) {
  const today = new Date(); today.setHours(0,0,0,0);
  const yesterday = new Date(today); yesterday.setDate(today.getDate()-1);
  d.setHours(0,0,0,0);
  if (d.getTime() === today.getTime()) return 'Today';
  if (d.getTime() === yesterday.getTime()) return 'Yesterday';
  return d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
}

document.getElementById('prevDay').onclick = () => { currentDate.setDate(currentDate.getDate()-1); refresh(); };
document.getElementById('nextDay').onclick = () => { currentDate.setDate(currentDate.getDate()+1); refresh(); };

// ── Theme toggle ──────────────────────────────────────────────────────────
function currentTheme() {
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr) return attr;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyThemeIcon() {
  document.getElementById('themeToggle').textContent = currentTheme() === 'dark' ? '☀️' : '🌙';
}
document.getElementById('themeToggle').onclick = () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('nutrilog-theme', next);
  applyThemeIcon();
};
applyThemeIcon();

// ── Preselect date from ?date= (deep-link from calendar) ────────────────────
const urlDate = new URLSearchParams(window.location.search).get('date');
if (urlDate) currentDate = new Date(urlDate + 'T00:00:00');

async function loadData() {
  const [catsRes, foodsRes, logRes, summaryRes] = await Promise.all([
    fetch('/api/categories'),
    fetch('/api/food-items'),
    fetch(`/api/log?date=${isoDate(currentDate)}`),
    fetch(`/api/log/summary?date=${isoDate(currentDate)}`)
  ]);
  categories = await catsRes.json();
  allFoods = await foodsRes.json();
  logEntries = await logRes.json();
  const summary = await summaryRes.json();
  return summary;
}

function updateSummary(summary) {
  const t = summary.totals || {};
  document.getElementById('totalCals').textContent = Math.round(t.total_calories || 0);
  document.getElementById('totalProtein').textContent = Math.round(t.total_protein || 0) + 'g';
  document.getElementById('totalCarbs').textContent = Math.round(t.total_carbs || 0) + 'g';
  document.getElementById('totalFat').textContent = Math.round(t.total_fat || 0) + 'g';
}

function renderSlots() {
  const container = document.getElementById('slotsContainer');
  container.innerHTML = '';

  categories.forEach(cat => {
    const slotEntries = logEntries.filter(e => e.meal_slot === cat.id);
    const slotCals = slotEntries.reduce((s, e) => s + (e.calories_actual || 0), 0);
    const isOpen = openSlots.has(cat.id) || slotEntries.length > 0;
    if (isOpen) openSlots.add(cat.id);

    const card = document.createElement('div');
    card.className = 'slot-card' + (isOpen ? ' open' : '');
    card.innerHTML = `
      <div class="slot-header">
        <div class="slot-title">
          <span class="slot-icon">${cat.icon}</span>
          <div>
            <div class="slot-name">${cat.name}</div>
            <div class="slot-meta">${slotEntries.length} item${slotEntries.length !== 1 ? 's' : ''}</div>
          </div>
        </div>
        <div class="slot-right">
          ${slotCals > 0 ? `<span class="slot-cals">${slotCals} kcal</span>` : ''}
          <span class="chevron">▾</span>
        </div>
      </div>
      <div class="slot-body">
        <div class="logged-items" id="items-${cat.id}">
          ${slotEntries.length === 0 ? '<div class="empty-hint">Nothing logged yet</div>' :
            slotEntries.map(e => `
              <div class="log-entry" data-id="${e.id}">
                <div class="log-entry-left">
                  <div class="log-entry-name">${e.food_name}</div>
                  <div class="log-entry-meta">${e.quantity > 1 ? e.quantity + '× ' : ''}${e.serving_size}${e.serving_unit}</div>
                </div>
                <span class="log-entry-cals">${e.calories_actual} kcal</span>
                <button class="btn-remove" data-lid="${e.id}">✕</button>
              </div>
            `).join('')}
        </div>
        <button class="add-food-btn" data-slot="${cat.id}" data-name="${cat.name}">+ Add ${cat.name} item</button>
      </div>
    `;

    card.querySelector('.slot-header').addEventListener('click', () => {
      if (isOpen) openSlots.delete(cat.id); else openSlots.add(cat.id);
      card.classList.toggle('open');
    });

    card.querySelectorAll('.btn-remove').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        await fetch(`/api/log/${btn.dataset.lid}`, { method: 'DELETE' });
        refresh();
      });
    });

    card.querySelector('.add-food-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      openFoodModal(cat.id, cat.name);
    });

    container.appendChild(card);
  });
}

function openFoodModal(slotId, slotName) {
  currentSlot = slotId;
  document.getElementById('modalTitle').textContent = `Add to ${slotName}`;
  document.getElementById('searchInput').value = '';
  document.getElementById('scanStatus').style.display = 'none';
  document.getElementById('foodModal').classList.add('open');
  renderFoodList('');
  setTimeout(() => document.getElementById('searchInput').focus(), 100);
}

function renderFoodList(query) {
  const list = document.getElementById('foodList');
  const q = query.toLowerCase();
  const filtered = allFoods.filter(f =>
    f.name.toLowerCase().includes(q) ||
    f.category_name.toLowerCase().includes(q)
  );

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-hint">No items found</div>';
    return;
  }

  // Group by category
  const groups = {};
  filtered.forEach(f => {
    if (!groups[f.category_name]) groups[f.category_name] = [];
    groups[f.category_name].push(f);
  });

  list.innerHTML = Object.entries(groups).map(([cat, items]) => `
    <div style="font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;padding:8px 4px 4px">${cat}</div>
    ${items.map(f => `
      <div class="food-option" data-id="${f.id}">
        <div class="food-option-left">
          <div class="food-name">${f.name}</div>
          <div class="food-serving">${f.serving_size}${f.serving_unit}${f.protein_g > 0 ? ` · P:${f.protein_g}g C:${f.carbs_g}g F:${f.fat_g}g` : ''}</div>
        </div>
        <div class="food-option-right">${f.calories} kcal</div>
      </div>
    `).join('')}
  `).join('');

  list.querySelectorAll('.food-option').forEach(el => {
    el.addEventListener('click', () => {
      const food = allFoods.find(f => f.id === el.dataset.id);
      openQtyModal(food);
    });
  });
}

document.getElementById('searchInput').addEventListener('input', e => renderFoodList(e.target.value));
document.getElementById('closeModal').onclick = () => document.getElementById('foodModal').classList.remove('open');

// ── Camera food recognition ──────────────────────────────────────────────
fetch('/api/food-recognition/status').then(r => r.json()).then(s => {
  if (!s.configured) document.getElementById('scanBtn').style.display = 'none';
}).catch(() => { document.getElementById('scanBtn').style.display = 'none'; });

document.getElementById('scanBtn').onclick = () => document.getElementById('scanFileInput').click();

document.getElementById('scanFileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const statusEl = document.getElementById('scanStatus');
  statusEl.style.display = 'block';
  statusEl.textContent = 'Analysing photo…';

  const form = new FormData();
  form.append('photo', file);
  try {
    const url = currentSlot ? `/api/food-recognition?category_id=${currentSlot}` : '/api/food-recognition';
    const res = await fetch(url, { method: 'POST', body: form });
    if (!res.ok) throw new Error((await res.json()).error || 'Recognition failed');
    const result = await res.json();
    renderScanResult(result);
  } catch (err) {
    statusEl.innerHTML = `Couldn't recognise that photo — try searching instead.`;
  }
  e.target.value = '';
});

function renderScanResult(result) {
  const statusEl = document.getElementById('scanStatus');
  if (result.caption) {
    statusEl.innerHTML = `We saw: <span class="caption">"${result.caption}"</span>`;
  } else if (result.tags && result.tags.length) {
    statusEl.innerHTML = `We detected: <span class="caption">${result.tags.slice(0, 5).join(', ')}</span>`;
  } else {
    statusEl.innerHTML = `Couldn't recognise anything useful — try searching instead.`;
  }

  const list = document.getElementById('foodList');
  if (result.suggestions.length === 0) return;

  const html = `
    <div style="font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;padding:8px 4px 4px">Did you mean…</div>
    ${result.suggestions.map(f => `
      <div class="food-option suggested" data-id="${f.id}">
        <div class="food-option-left">
          <div class="food-name">${f.name}</div>
          <div class="food-serving">${f.serving_size}${f.serving_unit}</div>
        </div>
        <div class="food-option-right">${f.calories} kcal</div>
      </div>
    `).join('')}
  `;
  list.insertAdjacentHTML('afterbegin', html);
  list.querySelectorAll('.food-option.suggested').forEach(el => {
    el.addEventListener('click', () => {
      const food = result.suggestions.find(f => f.id === el.dataset.id);
      openQtyModal(food);
    });
  });
}
document.getElementById('foodModal').addEventListener('click', e => {
  if (e.target === document.getElementById('foodModal')) document.getElementById('foodModal').classList.remove('open');
});

function openQtyModal(food) {
  currentFoodItem = food;
  currentQty = 1;
  document.getElementById('foodModal').classList.remove('open');
  document.getElementById('qtyItemName').textContent = food.name;
  document.getElementById('qtyItemServing').textContent = `Serving: ${food.serving_size}${food.serving_unit} = ${food.calories} kcal`;
  updateQtyDisplay();
  document.getElementById('qtyModal').classList.add('open');
}

function updateQtyDisplay() {
  document.getElementById('qtyVal').textContent = currentQty;
  document.getElementById('qtyCals').textContent = Math.round(currentFoodItem.calories * currentQty);
}

document.getElementById('qtyMinus').onclick = () => { if (currentQty > 0.5) { currentQty = Math.round((currentQty - 0.5) * 10) / 10; updateQtyDisplay(); } };
document.getElementById('qtyPlus').onclick = () => { currentQty = Math.round((currentQty + 0.5) * 10) / 10; updateQtyDisplay(); };

document.getElementById('qtyConfirm').onclick = async () => {
  await fetch('/api/log', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      food_item_id: currentFoodItem.id,
      meal_slot: currentSlot,
      log_date: isoDate(currentDate),
      quantity: currentQty
    })
  });
  document.getElementById('qtyModal').classList.remove('open');
  openSlots.add(currentSlot);
  refresh();
};

document.getElementById('qtyCancel').onclick = () => {
  document.getElementById('qtyModal').classList.remove('open');
  document.getElementById('foodModal').classList.add('open');
};

async function refresh() {
  document.getElementById('dateLabel').textContent = formatDate(new Date(currentDate));
  const summary = await loadData();
  updateSummary(summary);
  renderSlots();
}

refresh();
</script>
</body>
</html>
