<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NutriLog · Oura</title>
<link rel="apple-touch-icon" sizes="180x180" href="/public/favicon/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/public/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/public/favicon/favicon-16x16.png">
<link rel="shortcut icon" href="/public/favicon/favicon.ico">
<link rel="manifest" href="/public/favicon/site.webmanifest">
<script>
  (function() {
    var saved = localStorage.getItem('nutrilog-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface2: #f1f5f9;
    --border: #e2e8f0;
    --accent: #10b981;
    --accent2: #6366f1;
    --warn: #d97706;
    --danger: #dc2626;
    --text: #0f172a;
    --text-muted: #94a3b8;
    --text-dim: #475569;
    --radius: 14px;
    --radius-sm: 8px;
  }
  :root[data-theme="dark"] {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3248;
    --accent: #6ee7b7;
    --accent2: #818cf8;
    --warn: #f59e0b;
    --danger: #ef4444;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --text-dim: #94a3b8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3248;
      --accent: #6ee7b7;
      --accent2: #818cf8;
      --warn: #f59e0b;
      --danger: #ef4444;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
    }
  }
  .theme-toggle { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; width: 34px; height: 34px; font-size: 0.95rem; cursor: pointer; flex-shrink: 0; }
  .theme-toggle:active { background: var(--border); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .logo { display: flex; align-items: center; gap: 8px; font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; }
  .logo img { height: 28px; width: auto; display: block; }
  .logo span { color: var(--accent); }

  .main-content { padding: 16px; padding-bottom: 90px; }

  .banner { background: var(--surface2); border: 1px dashed var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; font-size: 0.85rem; color: var(--text-dim); }
  .banner strong { color: var(--text); }

  .section-title { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin: 18px 4px 8px; }
  .section-title:first-child { margin-top: 0; }

  .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .stat-card .label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .stat-card .value { font-size: 1.6rem; font-weight: 800; }
  .stat-card .unit { font-size: 0.8rem; color: var(--text-muted); font-weight: 400; }
  .stat-card svg { width: 100%; height: 32px; margin-top: 8px; display: block; }
  .stat-card .approx-note { font-size: 0.65rem; color: var(--text-muted); margin-top: 6px; line-height: 1.3; }

  .badge-card .value { font-size: 1.1rem; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; }
  .badge.low { background: rgba(16,185,129,0.15); color: var(--accent); }
  .badge.watch { background: rgba(217,119,6,0.15); color: var(--warn); }
  .badge.elevated { background: rgba(220,38,38,0.15); color: var(--danger); }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); display: flex; z-index: 100; }
  .nav-item { flex: 1; padding: 10px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; text-decoration: none; color: var(--text-muted); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .nav-item.active { color: var(--accent); }
  .nav-icon { font-size: 1.2rem; }
  .brand-footer { display: flex; justify-content: center; padding: 12px 16px 8px; }
  .brand-footer img { height: 26px; width: auto; border-radius: 5px; opacity: 0.9; }
</style>
</head>
<body>

<div id="acctSwitcher"></div>
<script>
function escapeHtmlSwitcher(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
(async function initAcctSwitcher() {
  const [me, accessible] = await Promise.all([
    fetch('/api/me').then(r => r.json()),
    fetch('/api/delegates/accessible').then(r => r.json())
  ]);
  if (!me.acting_as && accessible.length === 0) return;

  const el = document.getElementById('acctSwitcher');
  el.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 16px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:0.8rem;color:var(--text-muted);';
  const meLabel = escapeHtmlSwitcher(me.real_display_name || me.real_email);
  const options = [`<option value="">${meLabel} (you)</option>`].concat(
    accessible.map(a => `<option value="${a.id}" ${me.acting_as && me.id === a.id ? 'selected' : ''}>${escapeHtmlSwitcher(a.display_name || a.email)}</option>`)
  );
  el.innerHTML = `Viewing: <select id="acctSelect" style="font-size:0.8rem;padding:2px 6px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);">${options.join('')}</select>`;
  document.getElementById('acctSelect').addEventListener('change', async (e) => {
    await fetch('/api/act-as', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({owner_user_id: e.target.value || null}) });
    window.location.reload();
  });
})();
</script>

<div class="header">
  <div class="logo"><img src="/public/assets/NutriLog.png" alt="">Nutri<span>Log</span></div>
  <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
</div>

<div class="main-content" id="mainContent">Loading…</div>
<div class="brand-footer"><img src="/public/assets/KingroupLogo.jpg" alt="Kin Group"></div>

<nav class="bottom-nav">
  <a class="nav-item" href="/"><span class="nav-icon">📋</span>Log</a>
  <a class="nav-item" href="/calendar"><span class="nav-icon">📅</span>Calendar</a>
  <a class="nav-item active" href="/oura"><span class="nav-icon">💍</span>Oura</a>
  <a class="nav-item" href="/health"><span class="nav-icon">🍎</span>Health</a>
  <a class="nav-item" href="/admin"><span class="nav-icon">⚙️</span>Admin</a>
</nav>

<script>
function sparkline(values, color) {
  if (values.length === 0) return '';
  const w = 300, h = 32;
  const max = Math.max(...values), min = Math.min(...values);
  const range = (max - min) || 1;
  const points = values.map((v, i) => {
    const x = (i / (values.length - 1 || 1)) * w;
    const y = h - ((v - min) / range) * h;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function avg(arr) {
  const vals = arr.filter(v => v !== null && v !== undefined);
  if (!vals.length) return null;
  return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
}

function card(label, unit, value, values, color) {
  return `
    <div class="stat-card">
      <div class="label">${label}${unit ? ` <span class="unit">${unit}</span>` : ''}</div>
      <div class="value">${value ?? '—'}</div>
      ${sparkline(values.filter(v => v !== null && v !== undefined), color)}
    </div>`;
}

function illnessBadge(score) {
  if (score === null || score === undefined) return { cls: 'low', label: 'Not enough data' };
  if (score >= 50) return { cls: 'elevated', label: 'Elevated' };
  if (score >= 20) return { cls: 'watch', label: 'Watch' };
  return { cls: 'low', label: 'Low' };
}

async function loadOura() {
  const status = await (await fetch('/api/oura/status')).json();
  const summary = await (await fetch('/api/oura/summary?days=30')).json();
  renderStats(summary, status);
}

function renderStats(summary, status) {
  const days = summary.days;
  const f = key => days.map(d => d[key]);

  const latestIllness = days.length ? days[days.length - 1].illness_risk_score : null;
  const badge = illnessBadge(latestIllness);

  const html = `
    ${summary.demo
      ? `<div class="banner"><strong>Demo data</strong> — ${status.configured
          ? 'connect your Oura ring in Admin to see real stats.'
          : "Oura integration isn't configured on this app yet."}</div>`
      : ''}

    <div class="section-title">Readiness &amp; Recovery</div>
    <div class="card-grid">
      ${card('Readiness Score', '', avg(f('readiness_score')), f('readiness_score'), 'var(--accent)')}
      ${card('HRV', 'ms', avg(f('hrv_ms')), f('hrv_ms'), 'var(--accent2)')}
      ${card('Physical Recovery', '', avg(f('physical_recovery_score')), f('physical_recovery_score'), 'var(--accent)')}
      ${card('Cognitive Recovery', '', avg(f('cognitive_recovery_score')), f('cognitive_recovery_score'), 'var(--accent2)')}
    </div>
    <div class="approx-note" style="padding:0 4px 4px;">Physical/Cognitive Recovery are approximated from Oura's resilience &amp; stress data — Oura has no field literally named this.</div>

    <div class="section-title">Sleep</div>
    <div class="card-grid">
      ${card('Sleep Score', '', avg(f('sleep_score')), f('sleep_score'), 'var(--accent2)')}
      ${card('Sleep Efficiency', '%', avg(f('sleep_efficiency')), f('sleep_efficiency'), 'var(--accent)')}
      ${card('Deep Sleep', 'min', avg(f('deep_sleep_minutes')), f('deep_sleep_minutes'), 'var(--accent2)')}
      ${card('REM Sleep', 'min', avg(f('rem_sleep_minutes')), f('rem_sleep_minutes'), 'var(--accent)')}
    </div>

    <div class="section-title">Body</div>
    <div class="card-grid">
      ${card('Resting HR', 'bpm', avg(f('resting_hr')), f('resting_hr'), 'var(--danger)')}
      ${card('SpO2', '%', avg(f('spo2_percent')), f('spo2_percent'), 'var(--accent)')}
      ${card('Respiratory Rate', 'br/min', avg(f('respiratory_rate')), f('respiratory_rate'), 'var(--accent2)')}
      ${card('Temp Deviation', '°C', avg(f('temperature_deviation')), f('temperature_deviation'), 'var(--warn)')}
    </div>
    <div class="card-grid">
      <div class="stat-card badge-card" style="grid-column: 1 / -1;">
        <div class="label">Illness Risk</div>
        <div class="value"><span class="badge ${badge.cls}">${badge.label}</span></div>
        <div class="approx-note">Not an Oura metric — a rough local signal from temperature and resting heart rate vs. your recent baseline. Not medical advice.</div>
      </div>
    </div>

    <div class="section-title">Activity</div>
    <div class="card-grid">
      ${card('Steps', 'avg/day', avg(f('steps')), f('steps'), 'var(--warn)')}
      ${card('Active Calories', 'kcal', avg(f('calories_burned')), f('calories_burned'), 'var(--accent)')}
    </div>
  `;
  document.getElementById('mainContent').insertAdjacentHTML('beforeend', html);
}

document.getElementById('mainContent').textContent = '';
loadOura();

// ── Theme toggle ──────────────────────────────────────────────────────────
function currentTheme() {
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr) return attr;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyThemeIcon() {
  document.getElementById('themeToggle').textContent = currentTheme() === 'dark' ? '☀️' : '🌙';
}
document.getElementById('themeToggle').onclick = () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('nutrilog-theme', next);
  applyThemeIcon();
};
applyThemeIcon();
</script>
</body>
</html>
