<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NutriLog · Oura</title>
<script>
  (function() {
    var saved = localStorage.getItem('nutrilog-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface2: #f1f5f9;
    --border: #e2e8f0;
    --accent: #10b981;
    --accent2: #6366f1;
    --warn: #d97706;
    --danger: #dc2626;
    --text: #0f172a;
    --text-muted: #94a3b8;
    --text-dim: #475569;
    --radius: 14px;
    --radius-sm: 8px;
  }
  :root[data-theme="dark"] {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3248;
    --accent: #6ee7b7;
    --accent2: #818cf8;
    --warn: #f59e0b;
    --danger: #ef4444;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --text-dim: #94a3b8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3248;
      --accent: #6ee7b7;
      --accent2: #818cf8;
      --warn: #f59e0b;
      --danger: #ef4444;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
    }
  }
  .theme-toggle { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; width: 34px; height: 34px; font-size: 0.95rem; cursor: pointer; flex-shrink: 0; }
  .theme-toggle:active { background: var(--border); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }

  .main-content { padding: 16px; padding-bottom: 90px; }

  .banner { background: var(--surface2); border: 1px dashed var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; font-size: 0.85rem; color: var(--text-dim); }
  .banner strong { color: var(--text); }

  .connect-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; text-align: center; margin-bottom: 16px; }
  .connect-card .ring-icon { font-size: 2.5rem; margin-bottom: 10px; }
  .connect-card h2 { font-size: 1.05rem; margin-bottom: 6px; }
  .connect-card p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; }
  .btn-connect { background: var(--accent); color: #0f1117; border: none; border-radius: 10px; padding: 12px 24px; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
  .btn-connect:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-disconnect { background: none; border: none; color: var(--text-muted); font-size: 0.8rem; cursor: pointer; margin-top: 10px; text-decoration: underline; }

  .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .stat-card .label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .stat-card .value { font-size: 1.6rem; font-weight: 800; }
  .stat-card .unit { font-size: 0.8rem; color: var(--text-muted); font-weight: 400; }
  .stat-card svg { width: 100%; height: 32px; margin-top: 8px; display: block; }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); display: flex; z-index: 100; }
  .nav-item { flex: 1; padding: 10px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; text-decoration: none; color: var(--text-muted); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .nav-item.active { color: var(--accent); }
  .nav-icon { font-size: 1.2rem; }
  .brand-footer { display: flex; justify-content: center; padding: 12px 16px 8px; }
  .brand-footer img { height: 26px; width: auto; border-radius: 5px; opacity: 0.9; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">Nutri<span>Log</span></div>
  <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
</div>

<div class="main-content" id="mainContent">Loading…</div>
<div class="brand-footer"><img src="/public/assets/KingroupLogo.jpg" alt="Kin Group"></div>

<nav class="bottom-nav">
  <a class="nav-item" href="/"><span class="nav-icon">📋</span>Log</a>
  <a class="nav-item" href="/calendar"><span class="nav-icon">📅</span>Calendar</a>
  <a class="nav-item active" href="/oura"><span class="nav-icon">💍</span>Oura</a>
  <a class="nav-item" href="/health"><span class="nav-icon">🍎</span>Health</a>
  <a class="nav-item" href="/admin"><span class="nav-icon">⚙️</span>Admin</a>
</nav>

<script>
function sparkline(values, color) {
  if (values.length === 0) return '';
  const w = 300, h = 32;
  const max = Math.max(...values), min = Math.min(...values);
  const range = (max - min) || 1;
  const points = values.map((v, i) => {
    const x = (i / (values.length - 1 || 1)) * w;
    const y = h - ((v - min) / range) * h;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function avg(arr) {
  const vals = arr.filter(v => v !== null && v !== undefined);
  if (!vals.length) return null;
  return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
}

async function loadOura() {
  const params = new URLSearchParams(window.location.search);
  const status = await (await fetch('/api/oura/status')).json();

  if (params.get('oura_error')) {
    document.getElementById('mainContent').insertAdjacentHTML('afterbegin',
      '<div class="banner">Couldn\'t connect to Oura — please try again.</div>');
  }

  if (!status.connected) {
    renderConnectCard(status.configured);
  }

  const summary = await (await fetch('/api/oura/summary?days=30')).json();
  renderStats(summary, status.connected);
}

function renderConnectCard(configured) {
  const html = `
    <div class="connect-card">
      <div class="ring-icon">💍</div>
      <h2>Connect your Oura Ring</h2>
      <p>${configured
        ? 'Sign in with Oura to bring your sleep, readiness and activity data into NutriLog.'
        : 'Oura integration isn\'t configured on this app yet — showing demo data below.'}</p>
      <button class="btn-connect" id="connectBtn" ${configured ? '' : 'disabled'}>Connect to Oura</button>
    </div>`;
  document.getElementById('mainContent').insertAdjacentHTML('afterbegin', html);
  const btn = document.getElementById('connectBtn');
  if (configured) btn.onclick = () => window.location.href = '/api/oura/authorize';
}

function renderStats(summary, connected) {
  const days = summary.days;
  const sleep = days.map(d => d.sleep_score);
  const readiness = days.map(d => d.readiness_score);
  const steps = days.map(d => d.steps);
  const hr = days.map(d => d.resting_hr);

  const html = `
    ${summary.demo ? '<div class="banner"><strong>Demo data</strong> — connect your Oura ring above to see real stats.</div>' : ''}
    <div class="card-grid">
      <div class="stat-card">
        <div class="label">Sleep Score</div>
        <div class="value">${avg(sleep) ?? '—'}</div>
        ${sparkline(sleep.filter(v => v !== null), 'var(--accent2)')}
      </div>
      <div class="stat-card">
        <div class="label">Readiness</div>
        <div class="value">${avg(readiness) ?? '—'}</div>
        ${sparkline(readiness.filter(v => v !== null), 'var(--accent)')}
      </div>
      <div class="stat-card">
        <div class="label">Steps <span class="unit">avg/day</span></div>
        <div class="value">${avg(steps) ?? '—'}</div>
        ${sparkline(steps.filter(v => v !== null), 'var(--warn)')}
      </div>
      <div class="stat-card">
        <div class="label">Resting HR <span class="unit">bpm</span></div>
        <div class="value">${avg(hr) ?? '—'}</div>
        ${sparkline(hr.filter(v => v !== null), 'var(--danger)')}
      </div>
    </div>
    ${connected ? '<button class="btn-disconnect" id="disconnectBtn">Disconnect Oura</button>' : ''}
  `;
  document.getElementById('mainContent').insertAdjacentHTML('beforeend', html);

  const disconnectBtn = document.getElementById('disconnectBtn');
  if (disconnectBtn) {
    disconnectBtn.onclick = async () => {
      if (!confirm('Disconnect your Oura ring?')) return;
      await fetch('/api/oura/disconnect', { method: 'DELETE' });
      window.location.reload();
    };
  }
}

document.getElementById('mainContent').textContent = '';
loadOura();

// ── Theme toggle ──────────────────────────────────────────────────────────
function currentTheme() {
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr) return attr;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyThemeIcon() {
  document.getElementById('themeToggle').textContent = currentTheme() === 'dark' ? '☀️' : '🌙';
}
document.getElementById('themeToggle').onclick = () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('nutrilog-theme', next);
  applyThemeIcon();
};
applyThemeIcon();
</script>
</body>
</html>
