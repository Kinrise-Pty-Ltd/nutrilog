<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NutriLog · Health</title>
<script>
  (function() {
    var saved = localStorage.getItem('nutrilog-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface2: #f1f5f9;
    --border: #e2e8f0;
    --accent: #10b981;
    --accent2: #6366f1;
    --warn: #d97706;
    --danger: #dc2626;
    --text: #0f172a;
    --text-muted: #94a3b8;
    --text-dim: #475569;
    --radius: 14px;
    --radius-sm: 8px;
  }
  :root[data-theme="dark"] {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3248;
    --accent: #6ee7b7;
    --accent2: #818cf8;
    --warn: #f59e0b;
    --danger: #ef4444;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --text-dim: #94a3b8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3248;
      --accent: #6ee7b7;
      --accent2: #818cf8;
      --warn: #f59e0b;
      --danger: #ef4444;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
    }
  }
  .theme-toggle { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; width: 34px; height: 34px; font-size: 0.95rem; cursor: pointer; flex-shrink: 0; }
  .theme-toggle:active { background: var(--border); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }

  .main-content { padding: 16px; padding-bottom: 90px; }

  .banner { background: var(--surface2); border: 1px dashed var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; font-size: 0.85rem; color: var(--text-dim); }
  .banner strong { color: var(--text); }

  .range-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .range-tab { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim); border-radius: 10px; padding: 9px 0; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
  .range-tab.active { background: var(--accent); color: #0f1117; border-color: var(--accent); }

  .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .stat-card .label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .stat-card .value { font-size: 1.6rem; font-weight: 800; }
  .stat-card .unit { font-size: 0.8rem; color: var(--text-muted); font-weight: 400; }
  .stat-card svg { width: 100%; height: 32px; margin-top: 8px; display: block; touch-action: none; }
  .stat-card .range-caption { font-size: 0.68rem; color: var(--text-muted); margin-top: 6px; }
  .chart-tooltip { position: fixed; display: none; background: var(--text); color: var(--bg); font-size: 0.72rem; font-weight: 600; padding: 4px 8px; border-radius: 6px; pointer-events: none; z-index: 500; white-space: nowrap; transform: translate(-50%, -100%); }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); display: flex; z-index: 100; }
  .nav-item { flex: 1; padding: 10px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; text-decoration: none; color: var(--text-muted); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .nav-item.active { color: var(--accent); }
  .nav-icon { font-size: 1.2rem; }
  .brand-footer { display: flex; justify-content: center; padding: 12px 16px 8px; }
  .brand-footer img { height: 26px; width: auto; border-radius: 5px; opacity: 0.9; }
</style>
</head>
<body>

<div id="acctSwitcher"></div>
<script>
function escapeHtmlSwitcher(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
(async function initAcctSwitcher() {
  const [me, accessible] = await Promise.all([
    fetch('/api/me').then(r => r.json()),
    fetch('/api/delegates/accessible').then(r => r.json())
  ]);
  if (!me.acting_as && accessible.length === 0) return;

  const el = document.getElementById('acctSwitcher');
  el.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 16px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:0.8rem;color:var(--text-muted);';
  const meLabel = escapeHtmlSwitcher(me.real_display_name || me.real_email);
  const options = [`<option value="">${meLabel} (you)</option>`].concat(
    accessible.map(a => `<option value="${a.id}" ${me.acting_as && me.id === a.id ? 'selected' : ''}>${escapeHtmlSwitcher(a.display_name || a.email)}</option>`)
  );
  el.innerHTML = `Viewing: <select id="acctSelect" style="font-size:0.8rem;padding:2px 6px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);">${options.join('')}</select>`;
  document.getElementById('acctSelect').addEventListener('change', async (e) => {
    await fetch('/api/act-as', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({owner_user_id: e.target.value || null}) });
    window.location.reload();
  });
})();
</script>

<div class="header">
  <div class="logo">Nutri<span>Log</span></div>
  <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
</div>

<div class="main-content">
  <div class="range-tabs" id="rangeTabs">
    <button class="range-tab" data-days="7">7 Days</button>
    <button class="range-tab active" data-days="30">30 Days</button>
    <button class="range-tab" data-days="90">90 Days</button>
  </div>
  <div id="healthResults">Loading…</div>
</div>
<div class="chart-tooltip" id="chartTooltip"></div>
<div class="brand-footer"><img src="/public/assets/KingroupLogo.jpg" alt="Kin Group"></div>

<nav class="bottom-nav">
  <a class="nav-item" href="/"><span class="nav-icon">📋</span>Log</a>
  <a class="nav-item" href="/calendar"><span class="nav-icon">📅</span>Calendar</a>
  <a class="nav-item" href="/oura"><span class="nav-icon">💍</span>Oura</a>
  <a class="nav-item active" href="/health"><span class="nav-icon">🍎</span>Health</a>
  <a class="nav-item" href="/admin"><span class="nav-icon">⚙️</span>Admin</a>
</nav>

<script>
function formatVal(v, decimals) {
  if (v === null || v === undefined) return '—';
  return decimals ? v.toFixed(decimals) : Math.round(v);
}

function avg(arr) {
  const vals = arr.filter(v => v !== null && v !== undefined);
  if (!vals.length) return null;
  return Math.round((vals.reduce((a, b) => a + b, 0) / vals.length) * 10) / 10;
}

// Card spec -> <svg> with an id, so a tooltip listener can be wired to it
// after the HTML is inserted (innerHTML doesn't carry over JS bindings).
function sparklineSvg(id, values, color) {
  const vals = values.filter(v => v !== null && v !== undefined);
  if (vals.length === 0) return '<div style="font-size:0.75rem;color:var(--text-muted);margin-top:8px;">No data yet</div>';
  const w = 300, h = 32;
  const max = Math.max(...vals), min = Math.min(...vals);
  const range = (max - min) || 1;
  const points = values.map((v, i) => {
    const x = (i / (values.length - 1 || 1)) * w;
    return v === null || v === undefined ? null : { x, y: h - ((v - min) / range) * h };
  });
  const polyline = points.filter(p => p).map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" id="${id}" class="sparkline"><polyline points="${polyline}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function rangeCaption(values, unit, decimals) {
  const vals = values.filter(v => v !== null && v !== undefined);
  if (!vals.length) return '';
  const lo = formatVal(Math.min(...vals), decimals);
  const hi = formatVal(Math.max(...vals), decimals);
  return `<div class="range-caption">Low ${lo} · High ${hi}${unit ? ' ' + unit : ''}</div>`;
}

// Pointer events (mouse + touch + pen in one) — finds the nearest data point
// to the pointer's X position along the sparkline and shows its date/value
// in a small floating tooltip, since the SVG has no built-in hit-testing
// of its own for a single polyline.
function attachSparklineTooltip(svgEl, dates, values, unit, decimals) {
  if (!svgEl) return;
  const tooltip = document.getElementById('chartTooltip');

  function showAt(clientX, clientY) {
    const rect = svgEl.getBoundingClientRect();
    if (rect.width === 0) return;
    const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    const idx = Math.round(ratio * (values.length - 1));
    const v = values[idx];
    if (v === null || v === undefined) { tooltip.style.display = 'none'; return; }
    const label = new Date(dates[idx] + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
    tooltip.textContent = `${label}: ${formatVal(v, decimals)}${unit ? ' ' + unit : ''}`;
    tooltip.style.display = 'block';
    tooltip.style.left = clientX + 'px';
    tooltip.style.top = (clientY - 12) + 'px';
  }

  svgEl.addEventListener('pointermove', e => showAt(e.clientX, e.clientY));
  svgEl.addEventListener('pointerdown', e => showAt(e.clientX, e.clientY));
  svgEl.addEventListener('pointerleave', () => { tooltip.style.display = 'none'; });
}

let currentDays = 30;

async function loadHealth() {
  const [summary, metrics] = await Promise.all([
    fetch(`/api/health/summary?days=${currentDays}`).then(r => r.json()),
    fetch('/api/health/metrics').then(r => r.json()),
  ]);
  renderStats(summary, metrics.filter(m => m.enabled));
}

const EXTRA_CARD_COLORS = ['var(--accent)', 'var(--warn)', 'var(--accent2)', 'var(--danger)'];

function renderStats(summary, enabledMetrics) {
  const days = summary.days;
  const dates = days.map(d => d.date);

  // Core cards, always shown, plus one per enabled optional metric.
  const cards = [
    { id: 'spark-steps', label: 'Steps', unit: 'avg/day', color: 'var(--accent)', values: days.map(d => d.steps), decimals: 0 },
    { id: 'spark-active_energy_kcal', label: 'Active Energy', unit: 'kcal', color: 'var(--warn)', values: days.map(d => d.active_energy_kcal), decimals: 0 },
    { id: 'spark-weight_kg', label: 'Weight', unit: 'kg', color: 'var(--accent2)', values: days.map(d => d.weight_kg), decimals: 1 },
    {
      id: 'spark-sleep_minutes', label: 'Sleep', unit: 'hrs/night', color: 'var(--danger)',
      values: days.map(d => d.sleep_minutes), decimals: 0,
      displayOverride: v => v === null ? '—' : (v / 60).toFixed(1),
      // Sparkline shape is unit-invariant (min/max normalization cancels the
      // /60), but the caption/tooltip should match the hrs/night shown above.
      tooltipValues: days.map(d => (d.sleep_minutes === null || d.sleep_minutes === undefined) ? null : d.sleep_minutes / 60),
      tooltipUnit: 'hrs', tooltipDecimals: 1,
    },
    ...enabledMetrics.map((m, i) => ({
      id: `spark-${m.key}`, label: m.label, unit: m.unit,
      color: EXTRA_CARD_COLORS[i % EXTRA_CARD_COLORS.length],
      values: days.map(d => d[m.key]), decimals: m.decimals,
    })),
  ];

  const html = `
    ${summary.demo ? '<div class="banner"><strong>Demo data</strong> — set up the connection in Admin to see your real stats.</div>' : ''}
    <div class="card-grid">
      ${cards.map(c => {
        const average = avg(c.values);
        const display = c.displayOverride ? c.displayOverride(average) : formatVal(average, c.decimals);
        const tooltipValues = c.tooltipValues ?? c.values;
        const tooltipUnit = c.tooltipUnit ?? c.unit;
        const tooltipDecimals = c.tooltipDecimals ?? c.decimals;
        return `
          <div class="stat-card">
            <div class="label">${c.label} <span class="unit">${c.unit}</span></div>
            <div class="value">${display}</div>
            ${sparklineSvg(c.id, c.values, c.color)}
            ${rangeCaption(tooltipValues, tooltipUnit, tooltipDecimals)}
          </div>
        `;
      }).join('')}
    </div>
  `;
  document.getElementById('healthResults').innerHTML = html;

  cards.forEach(c => attachSparklineTooltip(
    document.getElementById(c.id), dates,
    c.tooltipValues ?? c.values, c.tooltipUnit ?? c.unit, c.tooltipDecimals ?? c.decimals
  ));
}

document.querySelectorAll('.range-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.range-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentDays = parseInt(btn.dataset.days, 10);
    loadHealth();
  });
});

loadHealth();

// ── Theme toggle ──────────────────────────────────────────────────────────
function currentTheme() {
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr) return attr;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyThemeIcon() {
  document.getElementById('themeToggle').textContent = currentTheme() === 'dark' ? '☀️' : '🌙';
}
document.getElementById('themeToggle').onclick = () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('nutrilog-theme', next);
  applyThemeIcon();
};
applyThemeIcon();
</script>
</body>
</html>
